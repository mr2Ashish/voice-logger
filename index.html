<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryavarta Neural Voice Logger</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-glow: rgba(56, 189, 248, 0.4);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    /* Ambient Cinematic Background Glow */
    .container::before {
      content: '';
      position: absolute;
      top: -20px; left: -20px; right: -20px; bottom: -20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(16, 185, 129, 0.05));
      border-radius: 35px;
      z-index: -1;
      filter: blur(30px);
      animation: ambientPulse 6s infinite alternate ease-in-out;
    }

    @keyframes ambientPulse {
      0% { opacity: 0.4; transform: scale(0.98); }
      100% { opacity: 0.9; transform: scale(1.02); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 25px;
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      border: 1px solid var(--border-glow);
    }

    .brand-logo {
      font-size: 34px;
      margin-bottom: 2px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .badge {
      background: rgba(14, 165, 233, 0.12);
      color: var(--accent-cyan);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 500;
    }

    /* Super Cinematic Audio Wave Bars */
    .audio-visualizer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      height: 40px;
      margin: 10px 0 20px 0;
      opacity: 0.2;
      transition: opacity 0.3s ease;
    }
    .audio-visualizer.active {
      opacity: 1;
    }
    .bar {
      width: 4px;
      height: 8px;
      background: var(--accent-cyan);
      border-radius: 4px;
      animation: pulseWave 1s infinite ease-in-out;
    }
    .bar:nth-child(1) { animation-delay: 0.0s; }
    .bar:nth-child(2) { animation-delay: 0.15s; }
    .bar:nth-child(3) { animation-delay: 0.3s; }
    .bar:nth-child(4) { animation-delay: 0.45s; }
    .bar:nth-child(5) { animation-delay: 0.6s; }

    @keyframes pulseWave {
      0%, 100% { height: 6px; background: var(--accent-cyan); }
      50% { height: 32px; background: #34d399; box-shadow: 0 0 15px var(--accent-cyan); }
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #questionBox {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 20px;
      line-height: 1.5;
      min-height: 60px;
    }

    textarea {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(2, 6, 23, 0.6);
      color: #fff;
      font-size: 16px;
      min-height: 120px;
      resize: none;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      font-family: inherit;
    }
    textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      background: rgba(2, 6, 23, 0.85);
    }

    .btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 18px 30px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
      margin-top: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.5);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .hidden { display: none !important; }

    .fade-in {
      animation: fadeInAnim 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInAnim {
      from { opacity: 0; transform: scale(0.97) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card fade-in">
      <div class="brand-logo">⚡ ARYAVARTA</div>
      <div class="subtitle">Neural Shop Floor Intelligence</div>
      
      <div class="badge" id="phoneBadge">
        <span>🔒</span> <span id="badgeText">Verifying Secure Node...</span>
      </div>

      <!-- Start View -->
      <div id="startSection">
        <p id="instructionText" style="color: var(--text-muted); font-size: 15px; margin-bottom: 30px; line-height: 1.6;">
          दैनिक रिपोर्टिंग सिस्टम सक्रिय है। रोबोट आपके प्रश्नों को वाचित करेगा, और आप किसी भी भाषा में टाइप कर सकते हैं।
        </p>
        <button class="btn" id="startBtn" onclick="startLogging()">▶️ सत्र शुरू करें (Start Session)</button>
      </div>

      <!-- Active Quiz View -->
      <div id="quizSection" class="hidden">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="audio-visualizer" id="audioVisualizer">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div id="questionBox">Initializing Neural Voice...</div>
        <textarea id="answerInput" placeholder="यहाँ अपना उत्तर लिखें... (Hindi, Marathi, English)"></textarea>
        <button class="btn" id="nextBtn" onclick="submitAnswer()">अगला चरण ➔ (Proceed)</button>
      </div>

      <div id="status"></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzU06YZB3YCuNph4T9_hOp9KmQI3sbIwpgWivOndgUxw4AGG6UutjNTpqeIbFrHMjxh/exec";

    const questions = [
      "आज आपने किस प्रोजेक्ट पर काम किया?",
      "आज का आपका क्या टास्क था?",
      "आज आपका कितना टास्क पूरा हुआ है?",
      "आज का कितना टास्क बाकी है?"
    ];

    let currentStep = 0;
    let answers = [];
    let detectedPhone = "";
    const synth = window.speechSynthesis;

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      detectedPhone = (urlParams.get("phone") || "").replace(/[^0-9]/g, "").slice(-10);

      if (detectedPhone.length === 10) {
        document.getElementById("badgeText").innerText = "Node Verified: +91 " + detectedPhone;
      } else {
        document.getElementById("badgeText").innerText = "Node Unauthenticated";
        document.getElementById("phoneBadge").style.borderColor = "rgba(239, 68, 68, 0.4)";
        document.getElementById("phoneBadge").style.color = "#ef4444";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("startBtn").style.background = "#334155";
        document.getElementById("instructionText").innerHTML = "<b style='color:#ef4444;'>त्रुटि: लिंक में मोबाइल नंबर गायब है।</b><br>कृपया Slack चैनल में दिए गए अपने व्यक्तिगत लिंक पर क्लिक करें।";
      }
    };

    // Lag-Free Speech Synthesis Queue
    function speak(text, callback) {
      if (!synth) { if (callback) callback(); return; }
      
      synth.cancel(); // Clears any hanging audio queues instantly to prevent lag
      
      setTimeout(() => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'hi-IN';
        utter.rate = 0.95;

        const visualizer = document.getElementById("audioVisualizer");
        
        utter.onstart = () => visualizer.classList.add("active");
        utter.onend = () => { 
          visualizer.classList.remove("active"); 
          if (callback) callback(); 
        };
        
        synth.speak(utter);
      }, 150);
    }

    function startLogging() {
      if (detectedPhone.length !== 10) return;
      document.getElementById("startSection").classList.add("hidden");
      
      const quiz = document.getElementById("quizSection");
      quiz.classList.remove("hidden");
      quiz.classList.add("fade-in");
      
      askQuestion();
    }

    function askQuestion() {
      document.getElementById("answerInput").value = "";
      document.getElementById("answerInput").focus();
      
      const progressPercent = ((currentStep) / questions.length) * 100;
      document.getElementById("progressFill").style.width = progressPercent + "%";
      
      document.getElementById("questionBox").innerHTML = `प्रश्न ${currentStep + 1} / 4<br><span style="color:var(--accent-cyan);">${questions[currentStep]}</span>`;
      
      speak(questions[currentStep]);

      if (currentStep === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "✔️ सुरक्षित सबमिट करें (Finalize)";
      }
    }

    function submitAnswer() {
      const val = document.getElementById("answerInput").value.trim();
      if (!val) { alert("कृपया बॉक्स में अपना जवाब लिखें।"); return; }

      answers.push(val);
      currentStep++;

      if (currentStep < questions.length) { 
        askQuestion(); 
      } else { 
        finalizeSubmission(); 
      }
    }

    function finalizeSubmission() {
      document.getElementById("quizSection").classList.add("hidden");
      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("status").innerHTML = `<div style="color:var(--accent-cyan); font-weight:600; margin-top:10px;">☁️ Google Sheets डेटाबेस में सिंक हो रहा है...</div>`;

      speak("धन्यवाद, आपका दैनिक लॉग सुरक्षित रूप से रिकॉर्ड कर लिया गया है।", () => {});

      fetch(WEBHOOK_URL, {
        method: "POST",
        body: JSON.stringify({ phone: detectedPhone, answers: answers })
      })
      .then(() => {
        document.getElementById("status").innerHTML = `
          <div class="fade-in" style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.4); padding: 22px; border-radius: 18px; color: #34d399; margin-top: 15px; box-shadow: 0 10px 30px rgba(16,185,129,0.2);">
            <h3 style="margin:0 0 6px 0; font-size:20px;">✨ Log Synced Successfully</h3>
            <p style="margin:0; font-size:13px; color:var(--text-muted);">Your shop floor records have been updated instantly.</p>
          </div>
        `;
      })
      .catch(() => {
        document.getElementById("status").innerText = "❌ नेटवर्क त्रुटि। कृपया पुनः प्रयास करें।";
        document.getElementById("status").style.color = "#ef4444";
      });
    }
  </script>
</body>
</html>
