<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryavarta Voice & Text Monitor</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 25px 15px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; max-width: 440px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #334155; }
    .badge { background: #0284c7; color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
    textarea { width: 92%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; min-height: 80px; resize: none; margin-top: 10px; }
    button { background: #10b981; color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 15px; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    #questionBox { font-size: 17px; font-weight: 600; color: #38bdf8; margin: 15px 0; min-height: 48px; }
    #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ Aryavarta Daily Log</h2>
    <div class="badge" id="phoneBadge">Phone: Detecting...</div>

    <!-- Start View -->
    <div id="startSection">
      <p style="color:#94a3b8; font-size:14px; margin-bottom: 20px;">
        रोबोट सवाल पूछेगा, और आपको अपना जवाब नीचे लिखकर सबमिट करना है।
      </p>
      <button id="startBtn" onclick="startLogging()">▶️ शुरू करें (Start)</button>
    </div>

    <!-- Active Question & Answer View -->
    <div id="quizSection" class="hidden">
      <div id="questionBox">...</div>
      <textarea id="answerInput" placeholder="यहाँ अपना उत्तर लिखें... (Type in any language)"></textarea>
      <button id="nextBtn" onclick="submitAnswer()">अगला सवाल ➔ (Next)</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // Paste your Google Apps Script Web App Deployment URL here
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzU06YZB3YCuNph4T9_hOp9KmQI3sbIwpgWivOndgUxw4AGG6UutjNTpqeIbFrHMjxh/exec";

    const questions = [
      "आज आपने किस प्रोजेक्ट पर काम किया?",
      "आज का आपका क्या टास्क था?",
      "आज आपका कितना टास्क पूरा हुआ है?",
      "आज का कितना टास्क बाकी है?"
    ];

    let currentStep = 0;
    let answers = [];
    let detectedPhone = "";
    const synth = window.speechSynthesis;

    // Read phone from URL query param (?phone=XXXXXXXXXX)
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      detectedPhone = (urlParams.get("phone") || "").replace(/[^0-9]/g, "").slice(-10);

      if (detectedPhone.length === 10) {
        document.getElementById("phoneBadge").innerText = "📱 " + detectedPhone;
      } else {
        document.getElementById("phoneBadge").innerText = "⚠️ Phone number missing in link";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("status").innerText = "कृपया टेलीग्राम में दिए गए सही लिंक से ओपन करें।";
      }
    };

    function speak(text, callback) {
      if (!synth) { if (callback) callback(); return; }
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.rate = 0.95;
      utter.onend = () => { if (callback) callback(); };
      synth.speak(utter);
    }

    function startLogging() {
      document.getElementById("startSection").classList.add("hidden");
      document.getElementById("quizSection").classList.remove("hidden");
      askQuestion();
    }

    function askQuestion() {
      document.getElementById("answerInput").value = "";
      document.getElementById("answerInput").focus();
      
      const qText = `सवाल ${currentStep + 1} of 4: ${questions[currentStep]}`;
      document.getElementById("questionBox").innerText = qText;
      
      // Robot asks the question out loud
      speak(questions[currentStep]);

      if (currentStep === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "✔️ सबमिट करें (Submit Log)";
      }
    }

    function submitAnswer() {
      const val = document.getElementById("answerInput").value.trim();
      if (!val) {
        alert("कृपया बॉक्स में अपना जवाब लिखें।");
        return;
      }

      answers.push(val);
      currentStep++;

      if (currentStep < questions.length) {
        askQuestion();
      } else {
        finalizeSubmission();
      }
    }

    function finalizeSubmission() {
      document.getElementById("quizSection").classList.add("hidden");
      document.getElementById("status").innerText = "☁️ Google Sheets में सेव हो रहा है...";

      speak("धन्यवाद, आपका आज का वर्क लॉग सबमिट हो रहा है।", () => {});

      fetch(WEBHOOK_URL, {
        method: "POST",
        body: JSON.stringify({ phone: detectedPhone, answers: answers })
      })
      .then(() => {
        document.getElementById("status").innerText = "✅ Daily Log Submitted Successfully!";
        document.getElementById("status").style.color = "#10b981";
      })
      .catch(() => {
        document.getElementById("status").innerText = "❌ Network issue. Please check internet connection.";
        document.getElementById("status").style.color = "#ef4444";
      });
    }
  </script>
</body>
</html>
